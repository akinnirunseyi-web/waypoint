{% extends "base.html" %}

{% block title %}Report a Trail — Waypoint{% endblock %}

{% block content %}
    <h1>Report a Trail</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Your Name
            <input type="text" name="name" required>
        </label>
        <label>Email Address
            <input type="email" name="email" required>
        </label>
        <label>Trail Name
            <input type="text" name="trail" required>
        </label>
        <label>Your Note
            <textarea name="note" rows="4" required></textarea>
        </label>
        <button type="submit" class="btn">Submit Report</button>
    </form>
{% endblock %}
