{% extends "base.html" %}

{% block title %}Thank You — Waypoint{% endblock %}

{% block content %}
    <h1>Thank you, {{ name }}!</h1>
    <p>Your trail report for <strong>{{ trail_name }}</strong> has been received.</p>
    <p>We will follow up at <strong>{{ email }}</strong> if needed.</p>
    <p>Your note: <em>{{ note }}</em></p>
    <a href="{% url 'home' %}" class="btn">Back to Home</a>
{% endblock %}
