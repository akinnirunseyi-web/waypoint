{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waypoint</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'report' %}">Report a Trail</a>
        <a href="{% url 'search' %}">Search</a>
    </nav>

    <div class="container">
        <h1>Waypoint</h1>
        <p>{{ greeting }}</p>

        <div class="card">
            <h2>Find Your Trail</h2>
            <p>Use Waypoint to discover trails, plan trips, and report trail conditions.</p>
            <a href="{% url 'report' %}" class="btn">Report a Trail</a>
            <a href="{% url 'search' %}" class="btn">Search Trails</a>
        </div>
    </div>
</body>
</html>
