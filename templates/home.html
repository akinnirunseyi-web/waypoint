{% extends "base.html" %}

{% block title %}Waypoint — Home{% endblock %}

{% block content %}
    <h1>Waypoint</h1>
    <p>{{ greeting }}</p>

    <div class="card">
        <h2>Find Your Trail</h2>
        <p>Use Waypoint to discover trails, plan trips, and report trail conditions.</p>
        <a href="{% url 'report' %}" class="btn">Report a Trail</a>
        <a href="{% url 'search' %}" class="btn">Search Trails</a>
        <a href="{% url 'catalog' %}" class="btn">View Catalog</a>
    </div>
{% endblock %}
